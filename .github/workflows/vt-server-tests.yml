name: Vintage Telnet Server Tests

on:
  push:
    branches: [main]
    paths:
      - "vintage-telnet/server/**"
      - "vintage-telnet/tests/**"
      - "vintage-telnet/requirements.txt"
      - ".github/workflows/vt-server-tests.yml"
  pull_request:
    paths:
      - "vintage-telnet/server/**"
      - "vintage-telnet/tests/**"
      - "vintage-telnet/requirements.txt"
      - ".github/workflows/vt-server-tests.yml"

permissions:
  contents: read
  checks: write

jobs:
  test-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd vintage-telnet
          pip install -r requirements.txt

      - name: Run Vintage Telnet tests
        run: |
          cd vintage-telnet
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run code quality checks
        run: |
          cd vintage-telnet
          python -m py_compile server/*.py tests/*.py 2>&1 | tee compile-check.log
          if grep -q "SyntaxError\|IndentationError" compile-check.log; then
            exit 1
          fi
