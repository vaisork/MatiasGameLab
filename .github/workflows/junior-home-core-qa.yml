name: Junior HOME-CORE QA

on:
  push:
    branches:
      - junior/269-home-core-map-route-regression

jobs:
  home-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: vintage-telnet
        run: python -m pip install -r requirements.txt
      - name: HOME-CORE focused tests
        working-directory: vintage-telnet
        run: python -m unittest tests.test_home_core -v
      - name: Full Vintage Telnet suite
        working-directory: vintage-telnet
        run: python -m unittest discover -s tests
