name: Integrator reconciled PR79
on:
  push:
    branches:
      - integrator/review-79-reconciled-tests
jobs:
  vintage-telnet-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
