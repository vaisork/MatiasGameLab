name: VT #221 auth regression review

on:
  push:
    branches:
      - junior/issue-221-auth-regression

permissions:
  contents: read

jobs:
  test-auth-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run #221 focused tests
        run: python -m unittest tests.test_public_auth_regression tests.test_public_onboarding -v

      - name: Run complete Vintage Telnet suite
        run: python -m unittest discover -s tests -v
