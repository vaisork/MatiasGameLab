name: junior-386-regression
on:
  push:
    branches: [junior/269-ollama-provider-regression]
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_npc_ollama_regression.py' -v
      - run: python -m unittest discover -s tests -p 'test_npc_dialogue.py' -v
      - run: python -m unittest discover -s tests -v
