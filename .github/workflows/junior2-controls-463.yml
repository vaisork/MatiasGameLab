name: Junior 2 controls swap 463
on:
  push:
    branches:
      - programador-ligero-2/single-controls-swap-463-ci
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_entry.EntryTests.test_controls_swap_region_is_single_in_exploration_and_nearby_fauna -v
      - run: python -m unittest tests.test_entry -v
