name: VT Art — Publish on PR Approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish-on-approval:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Fetch all branches
        run: git fetch --all

      - name: Extract asset info from PR
        id: asset-info
        run: |
          # Obtener branch de la PR
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "pr_branch=$PR_BRANCH" >> $GITHUB_OUTPUT

          # Detectar asset_id y version de nombres comunes de ramas
          # Ej: art-drafts/run-123/creature_name/v001
          if [[ "$PR_BRANCH" =~ run-[0-9]+/([^/]+)/([^/]+)$ ]]; then
            ASSET_ID="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
            echo "asset_id=$ASSET_ID" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "✅ Detectado: $ASSET_ID $VERSION"
          fi

      - name: Publish approved image
        if: steps.asset-info.outputs.asset_id
        run: |
          python tools/vt_art/publish_approved.py

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const asset = '${{ steps.asset-info.outputs.asset_id }}';
            if (asset) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ **Aprobado.** Asset publicado a:\n- WebP → \`assets/vintage-telnet/\`\n- PNG → \`art-masters/\`\n\nLa imagen estará disponible en el servidor en el próximo deploy.`
              });
            }
