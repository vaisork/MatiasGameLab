name: Vintage Telnet review inventory UI

on:
  pull_request:
    paths:
      - "vintage-telnet/**"
      - ".github/workflows/vintage-telnet-review-inventory-ui.yml"

permissions:
  contents: read

jobs:
  vintage-telnet-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
