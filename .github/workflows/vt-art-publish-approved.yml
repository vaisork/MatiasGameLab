# VT1 legacy: automatic work frozen after VT2 cutover. Paths retained for rollback.
name: VT Art — Publish Approved to Assets

on:
  workflow_dispatch:
    inputs:
      legacy_ack:
        description: Ejecutar explícitamente pipeline VT1 legacy; no publica en VT2
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_ack == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Fetch all branches
        run: git fetch --all

      - name: Publish approved images to assets
        run: python tools/vt_art/publish_approved.py

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet HEAD -- assets/vintage-telnet/; then
            git add assets/vintage-telnet/ art-masters/
            git commit -m "vt-art: publish approved images to assets (auto)

          Automated publication of approved art assets.
          - Creatures → assets/vintage-telnet/creatures/ + art-masters/creatures/
          - Locations → assets/vintage-telnet/locations/ + art-masters/locations/"
            git push origin main
            echo "✅ Published approved images to main"
          else
            echo "ℹ️  No new approved images to publish"
          fi
