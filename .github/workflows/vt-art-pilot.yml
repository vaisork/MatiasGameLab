name: Vintage Telnet — piloto de arte

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: Ficha JSON aprobada dentro de vintage-telnet/art_requests
        required: true
        type: string
        default: vintage-telnet/art_requests/velozanco-edran-fase2.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vt-art-pilot
  cancel-in-progress: false

jobs:
  generate-one-draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install isolated art-pipeline dependencies
        run: python -m pip install -r tools/vt_art/requirements.txt

      - name: Generate one image draft
        id: generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VT_ART_MODEL: gpt-image-2.5-flare
          VT_ART_CRITIC_MODEL: gpt-5-mini
          VT_ART_REQUEST_FILE: ${{ inputs.request_file }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python -m tools.vt_art.github_runner

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          ASSET_ID: ${{ steps.generation.outputs.asset_id }}
          VERSION: ${{ steps.generation.outputs.version }}
          VERDICT: ${{ steps.generation.outputs.verdict }}
        run: |
          branch="art-drafts/run-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add -f vintage-telnet/art_generations/
          git commit -m "Add ${ASSET_ID} art draft ${VERSION} from run ${RUN_ID}"
          git push origin "$branch"

          metadata_path="vintage-telnet/art_generations/${ASSET_ID}/${VERSION}/metadata.json"
          image_path=$(jq -r '.image' "$metadata_path")
          {
            echo "Generated draft for **${ASSET_ID} ${VERSION}** from its approved brief."
            echo
            echo "![${ASSET_ID}](https://github.com/${{ github.repository }}/raw/art-drafts/run-${RUN_ID}/${image_path})"
            echo
            if [ "$VERDICT" = "aprobado" ]; then
              echo "**Autocrítica (visión, $(jq -r '.critique.model' "$metadata_path")): APROBADO.**"
              echo
              echo "$(jq -r '.critique.reasoning' "$metadata_path")"
            elif [ "$VERDICT" = "NECESITA REVISIÓN" ]; then
              echo "**Autocrítica (visión, $(jq -r '.critique.model' "$metadata_path")): NECESITA REVISIÓN.**"
              echo
              jq -r '.critique.issues[] | "- " + .' "$metadata_path"
            else
              echo "Autocrítica desactivada para esta corrida (\`VT_ART_CRITIC_MODEL\` vacío)."
            fi
            echo
            echo "This is a review-only draft. It is not approved or integrated into game runtime. Draft files are public because this repository is public. Remove unwanted drafts manually after review."
          } > "$RUNNER_TEMP/art-draft-pr.md"
          title="Art draft: ${ASSET_ID} ${VERSION}"
          if [ "$VERDICT" = "NECESITA REVISIÓN" ]; then
            title="[NEEDS REVISION] ${title}"
          fi
          gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body-file "$RUNNER_TEMP/art-draft-pr.md"
