name: Review Issue 22 adapter
on:
  push:
    branches:
      - programador-ligero-2/review-22-adapter-tests
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_npc_generator_adapter tests.test_npc_generator_bridge_integration -v
      - run: python -m unittest discover -s tests -v
