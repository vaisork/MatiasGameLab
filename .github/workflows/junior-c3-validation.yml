name: junior-c3-validation

on:
  push:
    branches:
      - junior/269-c3-pool-integrity

jobs:
  vintage-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_random_encounters -v
      - run: python -m unittest discover -s tests -v
