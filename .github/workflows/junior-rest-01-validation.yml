name: junior-rest-01-validation

on:
  push:
    branches:
      - junior/377-rest-budget

jobs:
  vintage-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_rest_budget tests.test_pilot_lindero_roto tests.test_death_regression -v
      - run: python -m unittest discover -s tests -v
