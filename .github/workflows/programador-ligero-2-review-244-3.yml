name: Programador Ligero 2 review Issue 244 final
on:
  push:
    branches:
      - programador-ligero-2/review-244-tests-3
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_entry -v
      - run: python -m unittest discover -s tests -v
