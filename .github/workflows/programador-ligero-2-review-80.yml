name: Programador Ligero 2 review PR80
on:
  push:
    branches:
      - programador-ligero-2/review-80-tests
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate content
        run: python scripts/validate-vintage-content.py
      - name: Run validator tests
        working-directory: vintage-telnet
        run: python -m unittest tests.test_validate_vintage_content -v
