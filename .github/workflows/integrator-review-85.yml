name: Integrator review PR85
on:
  push:
    branches:
      - integrator/review-85-tests

jobs:
  vintage-telnet-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Vintage Telnet suite
        run: python -m unittest discover -s tests -v
