name: Review Raspberry preflight
on:
  push:
    branches:
      - programador-ligero-2/review-raspberry-preflight
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile ops/raspberry_preflight.py
      - run: python ops/raspberry_preflight.py --help
