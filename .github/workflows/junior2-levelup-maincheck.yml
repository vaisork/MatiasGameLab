name: Junior 2 level-up current-main validation
on:
  push:
    branches:
      - programador-ligero-2/level-up-toast-370-maincheck
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_progression -v
      - run: python -m unittest tests.test_entry -v
      - run: python -m unittest discover -s tests -v
