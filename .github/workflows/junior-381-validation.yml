name: junior-381-validation
on:
  push:
    branches: [junior/381-level-up-event]
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_progression.py' -v
      - run: python -m unittest discover -s tests -p 'test_pilot_lindero_roto.py' -v
      - run: python -m unittest discover -s tests -v
