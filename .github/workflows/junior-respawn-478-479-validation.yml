name: junior-respawn-478-479-validation

on:
  push:
    branches:
      - junior/478-479-respawn-routing

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_respawn_routing -v
      - run: python -m unittest tests.test_death_regression -v
      - run: python -m unittest tests.test_cornalomo_death -v
      - run: python -m unittest tests.test_signature_skills -v
      - run: python -m unittest tests.test_major_fauna_engine -v
      - run: python -m unittest tests.test_boss_engine -v
      - run: python -m unittest discover -s tests -v
