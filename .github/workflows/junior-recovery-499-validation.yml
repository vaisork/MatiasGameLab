name: junior-recovery-499-validation

on:
  push:
    branches:
      - junior/499-recovery-content

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_recovery_economy -v
      - run: python -m unittest tests.test_economy_core -v
      - run: python -m unittest tests.test_inventory -v
      - run: python -m unittest tests.test_rest_budget -v
      - run: python -m unittest discover -s tests -v
