name: junior-korven-466-validation

on:
  push:
    branches:
      - junior/466-korven-flag-reconcile

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintage-telnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_korven_weapon -v
      - run: python -m unittest tests.test_story_flags -v
      - run: python -m unittest tests.test_npc_dialogue -v
      - run: python -m unittest discover -s tests -v
